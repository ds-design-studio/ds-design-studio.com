entries:
    - question: How long does a website redesign take?
      answer: This will depend on the project scope and on the readiness of content and imagery upon commencement, but 4–6 weeks is typical for a smaller project; 3–5 months for a larger project.
    - question: Will I be able to make changes to the website on my own after it launches?
      answer: Yes, your site will come with a built-in content management system (CMS) that non-technical users can use to make ongoing changes to the site, such as uploading images or adding new pages. My CMS of choice is <a href="/services#statamic">Statamic</a>, an excellent platform with a user-friendly control panel.
    - question: Do you offer hosting and support?
      answer: Yes, to streamline the process of transitioning your site from development to launch, I offer web hosting at affordable rates. Your site is hosted on a virtual private server (VPS), increasing its performance and security, and I manage all updates and maintenance so that you only have to focus on your site’s content. Additionally, I offer limited built-in monthly support, so you can reach out to me with issues as they arise.
    - question: Are there other aspects of a website redesign not included in your process that I should be aware of?
      answer: Yes, there are a few other (optional) services and costs that you may want to consider as part of a website redesign which are not included in what I offer. Some examples include <strong>copywriting and copyediting</strong> of text content, sourcing <strong>graphics and photography</strong>, and setting up custom <strong>website analytics</strong>. For some of these, I can offer my recommendations and help you integrate them with the site, but they fall under your responsibility.
